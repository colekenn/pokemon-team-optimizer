services:
  - type: web
    name: pokemon-team-optimizer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string (postgresql+psycopg://...?sslmode=require)
      - key: REDIS_URL
        sync: false # paste your Upstash connection string (rediss://...)
      - key: CORS_ORIGINS
        sync: false # your frontend url, e.g. https://your-app.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.7
